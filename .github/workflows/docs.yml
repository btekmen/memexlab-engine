name: Deploy docs

# Builds the MkDocs site from docs/ and deploys it to GitHub Pages.
# Activate by enabling Pages (Settings -> Pages -> Source: GitHub Actions).
# Note: Pages on a private repo requires a plan that supports it; make the
# repo public (or use a qualifying plan) before enabling.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdocs build   # add --strict once you want broken-link/nav warnings to fail the build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
