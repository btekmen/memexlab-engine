[project]
name = "memexlab-cli"
version = "0.1.0"
description = "memex — a local-first CLI over a plain-markdown vault. First stone: the ingest spine (capture into inbox/ with provenance, dry-run by default)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MemexLab" }]
keywords = ["markdown", "knowledge-base", "local-first", "pkm", "capture"]
dependencies = [
    "pyyaml>=6.0",
    "trafilatura>=1.8",
]

[project.scripts]
memex = "memex_cli.cli:main"

[project.urls]
Homepage = "https://memexlab.xyz"
Repository = "https://github.com/btekmen/memexlab-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex_cli"]
